<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02050d">
<title>Le Labo du Clos – Splash</title>
<style>
  html,body{margin:0;height:100%;background:#02050d;overflow:hidden}
  #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#02050d;z-index:9999;transition:opacity .6s ease;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #splash.hide{opacity:0;pointer-events:none}
  .stage{position:relative;width:min(100vw,100vh,960px);aspect-ratio:1/1}
  .stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #logoFinal{opacity:0;transition:opacity .5s ease}
  #splash.done #logoFinal{opacity:1}
  #skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:20px;padding:8px 14px;font:14px system-ui}
  #app{color:#fff;font:18px system-ui;display:flex;height:100%;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app">Ici : ton application (accueil, connexion…)</div>

<div id="splash" aria-label="Le Labo du Clos">
  <div class="stage">
    <img id="logoFinal" src="logo-final-960.png" alt="Le Labo du Clos">
    <video id="v" muted playsinline webkit-playsinline preload="auto" poster="poster-debut.jpg"></video>
  </div>
  <button id="skip" type="button">Passer</button>
</div>

<script>
(function(){
  var splash=document.getElementById('splash'), v=document.getElementById('v');
  var finished=false;

  // 1) Une seule fois par session + respect de "réduire les animations"
  var seen=false; try{seen=sessionStorage.getItem('splashSeen')==='1'}catch(e){}
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(seen||reduce){ splash.remove(); return; }

  // 2) Choix de la version selon l'écran et la connexion
  var small=Math.min(screen.width,screen.height)<=700 || (navigator.connection&&navigator.connection.saveData);
  var mp4 = small ? 'logo-anim-mobile-540.mp4' : 'logo-anim-960.mp4';
  v.src = mp4;

  // 3) Fin : logo statique net, puis fondu vers l'application
  function finish(){
    if(finished) return; finished=true;
    splash.classList.add('done');
    try{sessionStorage.setItem('splashSeen','1')}catch(e){}
    setTimeout(function(){ splash.classList.add('hide'); setTimeout(function(){splash.remove()},700); }, 1200);
  }
  v.addEventListener('ended',finish);
  v.addEventListener('error',finish);
  document.getElementById('skip').addEventListener('click',finish);

  // 4) Lecture auto ; si le navigateur refuse (économie d'énergie iOS), logo statique direct
  var p=v.play(); if(p&&p.catch){ p.catch(finish); }
  setTimeout(function(){ if(!finished && v.paused) finish(); }, 2500);   // sécurité
  setTimeout(finish, 12000);                                              // sécurité absolue
})();
</script>
</body>
</html>
