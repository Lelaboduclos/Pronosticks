<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Labo du Clos</title>
<meta name="theme-color" content="#0b0420">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0b0420;color:#fff;min-height:100vh;overflow-x:hidden}
#fond{position:fixed;inset:0;z-index:0}
.page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:2.2rem;margin:20px 0 4px;background:linear-gradient(90deg,#ffd700,#fff3a0,#ffd700);-webkit-background-clip:text;color:transparent;text-shadow:0 0 30px #ffd70088}
.sous{text-align:center;color:#c9b6ff;margin-bottom:20px}
.carte{background:#1a0b3dcc;border:1px solid #ffd70066;border-radius:18px;padding:20px;margin:14px 0;backdrop-filter:blur(6px);box-shadow:0 0 25px #8a2be244}
.carte.tremble{animation:tremble .4s}
@keyframes tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
input{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #8a2be2;background:#0b0420;color:#fff;font-size:1rem}
button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
.vert{background:#00ff9d;color:#032}
.dore{background:linear-gradient(90deg,#ffd700,#ffb700);color:#321}
.lien{background:none;color:#c9b6ff;font-weight:400;text-decoration:underline;font-size:.9rem}
.erreur{color:#ff5470;text-align:center;min-height:1.2em;margin-top:6px}
.match{display:flex;flex-direction:column;gap:8px}
.match .quand{color:#ffd700;font-size:.85rem}
.choix{display:flex;gap:8px}
.choix button{margin:0;background:#2a1366;color:#fff;border:1px solid #8a2be2}
.choix button.actif{background:#ffd700;color:#321}
.petit{font-size:.7rem;color:#8d7bbf;text-align:center;margin-top:30px}
.lapin{opacity:.35;text-align:center;margin-top:24px;font-size:.65rem}
.lapin svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.musique{position:fixed;top:12px;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;padding:0;background:#ffd700;color:#321}
.pastille{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.on{background:#00ff9d}.off{background:#666}
</style>
</head>
<body>
<canvas id="fond"></canvas>
<button class="musique" id="btnMusique" title="Musique">&#9835;</button>
<div class="page">
<h1>Le Labo du Clos</h1>
<p class="sous">Pronostique, gagne, deviens Ticket d'Or</p>

<div id="vueAccueil">
  <div class="carte" id="carteLogin">
    <input id="email" type="email" placeholder="Adresse e-mail">
    <input id="mdp" type="password" placeholder="Mot de passe">
    <div class="erreur" id="erreur"></div>
    <button class="vert" id="btnConnexion">Se connecter</button>
    <button class="dore" id="btnInscription">Créer mon compte</button>
    <button class="lien" id="btnOubli">Mot de passe oublié</button>
  </div>
</div>

<div id="vueMatchs" style="display:none">
  <div class="carte">
    <b id="salut"></b>
    <button class="lien" id="btnDeco">Se déconnecter</button>
  </div>
  <div id="listeMatchs"></div>
</div>

<div class="lapin">
  <svg viewBox="0 0 24 24" fill="#ffd700"><ellipse cx="8" cy="6" rx="2" ry="5"/><ellipse cx="16" cy="6" rx="2" ry="5"/><circle cx="12" cy="15" r="6"/></svg>
  mon petit bichon
</div>
<p class="petit">Le Labo du Clos · Ticket d'Or chaque 1er décembre</p>
</div>

<script>
const SUPABASE_URL = "https://herjmwgirdrpfawwsfec.supabase.co";
const SUPABASE_KEY = "sb_publishable_1-d455iPyqKCBsK-s70tjA_0e-l8hEh";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- Sons (générés par le navigateur, aucun fichier à ajouter) ----------
let ctx;
function son(freqs, duree=0.12){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.15, ctx.currentTime+i*duree);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*duree+duree);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+i*duree); o.stop(ctx.currentTime+i*duree+duree);
    });
  }catch(e){}
}
const sonClic=()=>son([880,1320]);
const sonValide=()=>{son([660,880,1320,1760],0.1); try{const u=new SpeechSynthesisUtterance('Parfait !');u.lang='fr-FR';speechSynthesis.speak(u);}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest('button'))sonClic()});

// ---------- Musique de fond douce (boucle simple) ----------
let musiqueOn=false, timerMusique;
const notes=[262,330,392,330,294,370,440,370];
let n=0;
function jouerNote(){ son([notes[n%notes.length]],0.5); n++; }
document.getElementById('btnMusique').onclick=()=>{
  musiqueOn=!musiqueOn;
  if(musiqueOn){jouerNote();timerMusique=setInterval(jouerNote,500);}
  else clearInterval(timerMusique);
};

// ---------- Décor 3D : diamants et billets qui flottent ----------
const canvas=document.getElementById('fond');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.z=12;
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const lum=new THREE.PointLight(0xffd700,1.2);lum.position.set(5,8,10);scene.add(lum);
const objets=[];
for(let i=0;i<14;i++){
  const diamant=new THREE.Mesh(new THREE.OctahedronGeometry(0.6),new THREE.MeshStandardMaterial({color:0x66e0ff,metalness:.9,roughness:.1}));
  const billet=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.8,0.02),new THREE.MeshStandardMaterial({color:0x2ecc71,metalness:.3,roughness:.5}));
  [diamant,billet].forEach(o=>{
    o.position.set((Math.random()-.5)*20,(Math.random()-.5)*14,(Math.random()-.5)*8-2);
    o.userData.v=Math.random()*0.02+0.005;
    scene.add(o);objets.push(o);
  });
}
function anime(){
  requestAnimationFrame(anime);
  objets.forEach(o=>{o.rotation.x+=o.userData.v;o.rotation.y+=o.userData.v*1.4;o.position.y+=Math.sin(Date.now()/1000+o.position.x)*0.004;});
  renderer.render(scene,camera);
}
anime();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

// ---------- Connexion ----------
const erreur=document.getElementById('erreur');
function montrerErreur(m){erreur.textContent=m;const c=document.getElementById('carteLogin');c.classList.remove('tremble');void c.offsetWidth;c.classList.add('tremble');}

document.getElementById('btnConnexion').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:email.value,password:mdp.value});
  if(error) montrerErreur('Mot de passe ou e-mail incorrect.'); else ouvrirMatchs();
};
document.getElementById('btnInscription').onclick=async()=>{
  const {error}=await sb.auth.signUp({email:email.value,password:mdp.value});
  if(error) montrerErreur(error.message); else ouvrirMatchs();
};
document.getElementById('btnOubli').onclick=async()=>{
  if(!email.value){montrerErreur('Écris d\'abord ton e-mail.');return;}
  await sb.auth.resetPasswordForEmail(email.value);
  erreur.style.color='#00ff9d';erreur.textContent='E-mail de réinitialisation envoyé.';
};
document.getElementById('btnDeco').onclick=async()=>{
  await sb.auth.signOut();location.reload();
};

// ---------- Matchs et pronostics ----------
async function ouvrirMatchs(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return;
  vueAccueil.style.display='none';vueMatchs.style.display='block';
  salut.textContent='Bienvenue '+user.email;
  await sb.from('profiles').update({en_ligne:true,last_seen:new Date().toISOString()}).eq('id',user.id);
  const {data:matchs}=await sb.from('matchs').select('*').order('date_match',{ascending:true});
  const liste=document.getElementById('listeMatchs');
  liste.innerHTML='';
  (matchs||[]).forEach(m=>{
    const quand=m.date_match?new Date(m.date_match).toLocaleString('fr-FR',{dateStyle:'full',timeStyle:'short'}):'Date à venir';
    const div=document.createElement('div');
    div.className='carte match';
    div.innerHTML='<div class="quand">'+quand+'</div><b>'+(m.equipe1||'Équipe 1')+' vs '+(m.equipe2||'Équipe 2')+'</b>'+
      '<div class="choix"><button data-c="1">1</button><button data-c="N">Nul</button><button data-c="2">2</button></div>'+
      '<input class="score" placeholder="Score exact (ex : 2-1)"><input class="buteurs" placeholder="Buteurs (ex : Mbappé, Griezmann)">'+
      '<button class="dore valider">Valider mon pronostic</button>';
    let choix=null;
    div.querySelectorAll('.choix button').forEach(b=>b.onclick=()=>{choix=b.dataset.c;div.querySelectorAll('.choix button').forEach(x=>x.classList.remove('actif'));b.classList.add('actif');});
    div.querySelector('.valider').onclick=async()=>{
      if(!choix){alert('Choisis 1, Nul ou 2.');return;}
      const {error}=await sb.from('pronostics').upsert({match_id:m.id,user_id:user.id,choix:choix,score_prevu:div.querySelector('.score').value,buteurs:div.querySelector('.buteurs').value},{onConflict:'match_id,user_id'});
      if(error) alert('Erreur : '+error.message); else sonValide();
    };
    liste.appendChild(div);
  });
}
sb.auth.getSession().then(({data})=>{if(data.session)ouvrirMatchs();});
</script>
</body>
</html>
