<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="LE LABO DU CLOS — pronostics sportifs entre amis.">
  <title>LE LABO DU CLOS — Pronos entre amis</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root{--bg:#080a13;--panel:#111626;--panel2:#171e31;--line:#283149;--gold:#f3c96a;--gold2:#a97724;--purple:#9b73ff;--pink:#ff5d9e;--green:#48d6a0;--red:#ff6877;--muted:#9ca7bd;--white:#f6f7fb;--shadow:0 18px 55px #0008}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#292044 0,#101426 37%,var(--bg) 75%);color:var(--white);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.gold{color:var(--gold)}.tiny{font-size:.78rem}.wrap{width:min(1120px,100% - 28px);margin:auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#ffe9a4,#b87b25 60%,#704516);display:grid;place-items:center;box-shadow:0 7px 24px #d39b3c55;color:#17100a;font-size:25px;position:relative}.brand-mark:after{content:"GAGNANT";position:absolute;bottom:4px;font-size:6px;font-weight:900;letter-spacing:1px}.brand h1{font:800 17px Cinzel,serif;letter-spacing:1.3px;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:3px}
    .pill{border:1px solid var(--line);background:#ffffff08;color:var(--muted);border-radius:99px;padding:8px 12px;font-size:12px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;color:#17120a;background:linear-gradient(135deg,#ffe6a0,#d49a38);box-shadow:0 8px 22px #d49a3827}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.secondary{background:#252d45;color:var(--white);box-shadow:none;border:1px solid var(--line)}.btn.purple{background:linear-gradient(135deg,#b79bff,#7951db);color:white}.btn.danger{background:#512936;color:#ffdce1;border:1px solid #874150;box-shadow:none}.btn.small{padding:8px 11px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .cinematic-visual{position:relative;overflow:hidden;border:1px solid #8b6bba;border-radius:24px;margin:4px 0 18px;box-shadow:0 18px 50px #0009;isolation:isolate;background:#111}
    .cinematic-visual img{display:block;width:100%;aspect-ratio:16/9;max-height:560px;object-fit:cover;object-position:center 48%;animation:stadiumDrift 22s ease-in-out infinite alternate}@keyframes stadiumDrift{from{transform:scale(1)}to{transform:scale(1.045)}}
    .cinematic-visual:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#080a13dd);pointer-events:none}
    .cinematic-caption{position:absolute;z-index:1;left:20px;right:20px;bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:700 clamp(11px,2vw,17px) Cinzel,serif;text-shadow:0 2px 8px #000}
    .cinematic-caption span{color:#ffe19a}.cinematic-caption strong{color:#fff;letter-spacing:1px}
    .hero{position:relative;overflow:hidden;border:1px solid #d6a74a55;border-radius:26px;padding:30px;background:linear-gradient(115deg,#171b2e 0%,#231b36 55%,#171725 100%);box-shadow:var(--shadow);display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center}.hero:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-100px;top:-170px;background:radial-gradient(circle,#f4c96a25,transparent 68%)}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px;font-weight:800}.hero h2{font:800 clamp(27px,5vw,48px) Cinzel,serif;line-height:1.12;margin:12px 0}.hero p{color:#c2c8d8;line-height:1.65;max-width:620px}.hero-art{font-size:clamp(85px,14vw,150px);text-align:center;filter:drop-shadow(0 14px 18px #d69a3855);position:relative}.hero-art span{display:block;font:800 10px Inter;letter-spacing:3px;color:var(--gold);margin-top:-8px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat,.card{background:linear-gradient(145deg,#151c2d,#101625);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 25px #0002}.stat strong{display:block;font-size:26px;margin-top:7px}.stat span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.section-head h2{font:700 21px Cinzel,serif;margin:0}.filters,.tabs{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#111827;color:var(--muted);border-radius:99px;padding:8px 12px;font-size:12px}.chip.active{background:#3b2c1a;color:var(--gold);border-color:#9d7335}
    .match{background:linear-gradient(145deg,#151d30,#111626);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px}.match-top{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:11px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0;text-align:center}.team{font-weight:800;font-size:15px}.versus{color:var(--gold);font:700 13px Cinzel}.predictions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pick{background:#202941;border:1px solid #34415e;color:#e8ebf4;border-radius:11px;padding:12px 8px;font-weight:800}.pick.selected{border-color:var(--gold);background:#4a3820;color:#ffdc8b}.pick:disabled{opacity:.55}.match-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;font-size:12px;color:var(--muted)}
    .field{display:grid;gap:7px;margin:11px 0}.field label{font-size:12px;color:#c5cce0;font-weight:700}.field input,.field select,.field textarea{width:100%;background:#0b1120;border:1px solid #303c58;border-radius:11px;padding:12px;color:white;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9b73ff20}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}.formgrid .full{grid-column:1/-1}
    .auth-shell{min-height:100vh;display:grid;place-items:center;padding:0;background:#070916;overflow:hidden}
    .auth-scene{position:relative;width:min(100vw,1648px);aspect-ratio:1648/928;overflow:hidden;box-shadow:0 0 70px #6b2cff55}
    .auth-scene-art{display:block;width:100%;height:100%;object-fit:cover}
    .auth-overlay{position:absolute;left:69.2%;top:13.8%;width:27%;height:58%;color:white}
    .auth-overlay-tabs{position:absolute;left:5%;right:5%;top:17%;height:13%;display:grid;grid-template-columns:1fr 1fr;gap:3%;}
    .auth-tab{border:1px solid #8f61ff;background:#080b1deF;color:#fff;border-radius:12px;font-size:clamp(8px,1.05vw,16px);font-weight:800;text-shadow:0 1px 4px #000;}
    .auth-tab.active{background:linear-gradient(135deg,#9b00ff,#5900c8);box-shadow:0 0 18px #b000ff99}
    .auth-overlay-form{position:absolute;inset:0}
    .auth-input{position:absolute;left:7%;width:86%;height:9.5%;border:1px solid #68739b;background:#11172beF;color:white;border-radius:10px;padding:0 4%;font-size:clamp(8px,1.02vw,15px);outline:none;box-shadow:inset 0 1px 8px #0008}
    .auth-input::placeholder{color:#c0c9e6;opacity:1}.auth-input:focus{border-color:#c18aff;box-shadow:0 0 0 2px #a33dff88}
    .pseudo-input{top:30%}.email-input{top:41%}.password-input{top:52%}
    .auth-submit{position:absolute;left:6%;top:64%;width:88%;height:10%;border:1px solid #ffe08a;border-radius:10px;background:linear-gradient(180deg,#ffdf27,#ff9d00);color:#211300;font-weight:1000;font-size:clamp(11px,1.25vw,18px);box-shadow:0 0 20px #ffbd27aa}
    .auth-switch{position:absolute;left:7%;top:79%;width:86%;height:9%;border:1px solid #8d67ba;border-radius:10px;background:#17152ceF;color:white;font-weight:800;font-size:clamp(8px,.95vw,14px)}
    .auth-forgot{position:absolute;left:15%;top:90%;width:70%;border:0;background:transparent;color:white;text-decoration:underline;font-size:clamp(8px,.85vw,13px);font-weight:700}
    .auth-message{position:absolute;left:6%;right:6%;top:74%;font-size:clamp(8px,.8vw,12px);text-align:center;color:#fff;background:#21172add;border-radius:7px;z-index:2;pointer-events:none}
    .auth-message:empty{display:none}.auth-message.error{background:#7c203dcc}.auth-message.ok{background:#155c42dd}
    @media(max-width:650px){.auth-shell{padding:0;min-height:100svh;align-items:start}.auth-scene{width:100vw;aspect-ratio:1648/928;margin-top:0}.auth-overlay{left:69.2%;top:13.8%;width:27%;height:58%}.auth-tab,.auth-input,.auth-switch,.auth-forgot{font-size:clamp(6px,1.65vw,10px)}.auth-submit{font-size:clamp(8px,2vw,12px)}.auth-input{padding:0 2%}}
    @media(max-width:390px){.auth-shell{overflow-x:hidden}.auth-scene{width:100vw}.auth-input::placeholder{font-size:6px}.auth-tab{font-size:6px}.auth-switch{font-size:6px}}

    .layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}.side-card{position:sticky;top:12px}.nav{position:sticky;bottom:0;z-index:5;background:#0b0f1deF;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px max(12px,calc((100% - 1120px)/2));display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:25px}.nav button{background:transparent;border:0;color:#9da8be;padding:9px 4px;border-radius:12px;font-size:11px;font-weight:700}.nav button.active{background:#2d2542;color:var(--gold)}.nav b{display:block;font-size:19px;margin-bottom:4px}
    .ranking-row{display:grid;grid-template-columns:35px 1fr auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #293149}.rank{width:30px;height:30px;border-radius:10px;background:#273149;display:grid;place-items:center;font-weight:800;color:var(--gold)}.avatar{width:38px;height:38px;border-radius:50%;background:#30274b;display:grid;place-items:center;font-size:21px;border:1px solid #6853a0}.chat-list{display:grid;gap:10px;max-height:420px;overflow:auto}.chat-msg{background:#202940;padding:11px 13px;border-radius:13px;max-width:90%}.chat-msg.mine{margin-left:auto;background:#392b55}.chat-msg small{display:block;color:#aab4ca;font-size:10px;margin-bottom:4px}.empty{text-align:center;padding:30px;color:var(--muted);border:1px dashed #34405a;border-radius:16px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#202940;border:1px solid #4a5878;padding:12px 17px;border-radius:12px;z-index:20;box-shadow:var(--shadow);max-width:90%;font-size:13px}
    footer{text-align:center;color:#65718a;font-size:10px;padding:20px 0 35px}
    @media(max-width:760px){.cinematic-visual img{aspect-ratio:4/3;max-height:390px}.cinematic-caption{left:12px;right:12px;bottom:10px;flex-direction:column;align-items:flex-start;gap:3px}.hero{grid-template-columns:1fr;padding:23px}.hero-art{display:none}.layout{grid-template-columns:1fr}.side-card{position:static}.grid{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.stat span{font-size:9px}.section-head{align-items:flex-start;flex-direction:column}.topbar{padding-top:12px}.brand h1{font-size:14px}}
    @media(max-width:420px){.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.grid{grid-template-columns:1fr 1fr}.grid .stat:last-child{grid-column:1/-1}.match{padding:13px}.team{font-size:13px}}
  </style>
</head>
<body>
<div id="authView" class="auth-shell">
  <div class="auth-scene">
