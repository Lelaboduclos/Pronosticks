<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Le Labo du Clos</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='https://cdn.jsdelivr.net/npm/chart.js@4'></script>
<script src='https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js'></script>
<style>
:root{--c:#00f0ff;--m:#ff2bd6;--v:#8a3dff;--l:#b6ff3b;--j:#ffd23f;--t:#eaf6ff;--g:#8ea0c8}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#05020f;color:var(--t);min-height:100vh;padding-bottom:84px}
#fond{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
header{padding:14px;text-align:center;background:#05020fcc;backdrop-filter:blur(8px);border-bottom:1px solid var(--c);box-shadow:0 0 20px #00f0ff55}
header h1{font-size:1.5rem;letter-spacing:3px;color:#fff;text-shadow:0 0 8px var(--c),0 0 22px var(--m)}
#enligne{font-size:.8rem;color:var(--l);margin-top:4px}
.hero{text-align:center;margin:34px 0 20px}
.hero h1{font-size:2.9rem;line-height:1.1;letter-spacing:4px;color:#fff;text-shadow:0 0 10px var(--c),0 0 30px var(--m),0 0 50px var(--v)}
.hero p{margin-top:10px;color:var(--c)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#05020fe6;border-top:1px solid var(--m);box-shadow:0 0 20px #ff2bd655;z-index:10}
nav button{flex:1;padding:12px 2px;background:none;border:none;color:var(--g);font-size:.7rem}
nav button.actif{color:var(--c);text-shadow:0 0 10px var(--c)}
nav span{display:block;font-size:1.3rem}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:#0d0a2399;backdrop-filter:blur(10px);border:1px solid #00f0ff55;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 0 18px #8a3dff44}
h2{margin-bottom:12px;color:var(--j);text-shadow:0 0 10px #ffd23f88}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #00f0ff66;background:#07051a;color:var(--t);font-size:1rem}
button.gros{width:100%;padding:13px;margin-top:8px;border:none;border-radius:12px;font-size:1rem;font-weight:bold;color:#fff;background:linear-gradient(90deg,var(--v),var(--m));box-shadow:0 0 16px #ff2bd688}
.lien{background:none;border:none;color:var(--c);text-decoration:underline;margin-top:10px}
.titre{display:flex;justify-content:space-between;gap:8px;font-weight:bold;margin-bottom:6px}
.badge{font-size:.72rem;padding:3px 9px;border-radius:20px;background:var(--v);white-space:nowrap;height:fit-content}
.choix{display:flex;gap:6px;margin-top:8px}
.choix button{flex:1;padding:11px 2px;border-radius:10px;border:2px solid #00f0ff44;background:#07051a;color:var(--t);font-size:.85rem}
.choix button.sel{border-color:var(--l);background:#b6ff3b26;box-shadow:0 0 12px #b6ff3b88}
.score{display:flex;gap:10px;align-items:center;margin-top:6px}
.score input{text-align:center;font-size:1.2rem}
.petit{color:var(--g);font-size:.8rem;margin-top:4px}
.rang{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff15}
.rang .num{width:30px;font-weight:bold;font-size:1.1rem}
.rang .nom{flex:1}
.rang .pts{font-weight:bold;color:var(--l)}
.point{width:12px;height:12px;border-radius:50%;background:#4a4f70}
.point.on{background:var(--l);box-shadow:0 0 10px var(--l)}
.onglets{display:flex;gap:8px;margin-bottom:12px}
.onglets button{flex:1;padding:10px;border-radius:12px;border:none;background:#07051a;color:var(--g)}
.onglets button.actif{background:var(--v);color:#fff}
#chatBox{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:#07051a;border:1px solid #00f0ff33}
.msg.moi{align-self:flex-end;background:var(--v)}
.msg b{display:block;font-size:.75rem;color:var(--j)}
.msg .sig{background:none;border:none;color:var(--g);font-size:.7rem}
.ligne{display:flex;gap:8px}
.ligne input{margin:0}
.ligne button{padding:0 18px;border:none;border-radius:12px;background:var(--l);font-weight:bold}
#anim{position:fixed;inset:0;display:none;background:#05020fd9;z-index:50}
#scene3d{position:absolute;inset:0;width:100%;height:100%}
#animTexte{position:absolute;bottom:12%;left:0;right:0;padding:0 16px;text-align:center;font-size:1.7rem;font-weight:bold;color:#fff;text-shadow:0 0 12px var(--m),0 0 24px var(--c)}
.cache{display:none}
</style>
</head>
<body>
<canvas id='fond'></canvas>
<header id='entete' class='cache'><h1>LE LABO DU CLOS</h1><div id='enligne'></div></header>
<div id='anim' onclick='fermerAnim()'><canvas id='scene3d'></canvas><p id='animTexte'></p></div>
<main>
<section id='vueAuth'>
  <div class='hero'><h1>LE LABO<br>DU CLOS</h1><p>⚽🏀🏒 Pronostics entre amis</p></div>
  <div class='card'>
    <h2 id='authTitre'>Inscription gratuite</h2>
    <input id='pseudo' placeholder='Ton pseudo'>
    <input id='email' type='email' placeholder='Ton adresse e-mail'>
    <input id='mdp' type='password' placeholder='Ton mot de passe (6 caractères minimum)'>
    <button class='gros' id='btnAuth'>Je m’inscris</button>
    <button class='lien' id='basculer'>J’ai déjà un compte, me connecter</button>
    <div class='petit' id='authMsg'></div>
  </div>
</section>
<section id='vueApp' class='cache'>
  <div id='pageMatchs'>
    <div class='card'><h2>Matchs à pronostiquer</h2>
      <select id='filtreSport'><option value=''>Tous les sports</option><option value='football'>⚽ Football</option><option value='basket'>🏀 Basket</option><option value='hockey'>🏒 Hockey</option></select>
    </div>
    <div id='listeMatchs'></div>
    <div class='card'><h2>Ajouter un match</h2>
      <select id='nvSport'><option value='football'>⚽ Football</option><option value='basket'>🏀 Basket</option><option value='hockey'>🏒 Hockey</option></select>
      <input id='nvComp' placeholder='Compétition (ex : Ligue 1)'>
      <input id='nvDom' placeholder='Équipe à domicile'>
      <input id='nvExt' placeholder='Équipe à l’extérieur'>
      <input id='nvDate' type='datetime-local'>
      <button class='gros' id='btnAjoutMatch'>Ajouter le match</button>
    </div>
  </div>
  <div id='pageClassement' class='cache'>
    <div class='card'><h2>🏆 Classement</h2>
      <div class='onglets'><button id='ongSemaine' class='actif'>Semaine</button><button id='ongMois'>Mois</button><button id='ongTout'>Total</button></div>
      <div id='classement'></div>
    </div>
    <div class='card'><h2>📈 Graphique des points</h2><canvas id='graph' height='220'></canvas></div>
    <div class='card'><h2>🔥 Tendances</h2><canvas id='graphTendance' height='220'></canvas></div>
  </div>
  <div id='pageChat' class='cache'>
    <div class='card'><h2>💬 Chat</h2><div id='chatBox'></div>
      <div class='ligne'><input id='chatTexte' maxlength='500' placeholder='Écris un message…'><button id='chatEnvoi'>Envoyer</button></div>
    </div>
  </div>
  <div id='pageMembres' class='cache'>
    <div class='card'><h2>👥 Les membres</h2><div id='listeMembres'></div></div>
  </div>
  <div id='pageProfil' class='cache'>
    <div class='card'><h2>👤 Mon profil</h2><p id='monPseudo'></p><p class='petit' id='monStat'></p>
      <button class='gros' id='btnDeco'>Me déconnecter</button>
    </div>
  </div>
  <nav>
    <button class='actif' data-page='pageMatchs'><span>⚽</span>Matchs</button>
    <button data-page='pageClassement'><span>🏆</span>Classement</button>
    <button data-page='pageChat'><span>💬</span>Chat</button>
    <button data-page='pageMembres'><span>👥</span>Membres</button>
    <button data-page='pageProfil'><span>👤</span>Profil</button>
  </nav>
</section>
</main>
<script>
const SUPABASE_URL='https://herjmwgirdrpfawwsfec.supabase.co';
const SUPABASE_CLE='sb_publishable_1-d455iPyqKCBsK-s70tjA_0e-l8hEh';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_CLE);
const $=id=>document.getElementById(id);
const CH=['nul','domicile','exterieur'];
let moi=null,modeInscription=true,periode='semaine',graphA=null,graphB=null,profs=[],enLigne=[],preds={},brouillon={};

function echap(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function debutPeriode(p){const d=new Date();
  if(p==='semaine'){const j=(d.getDay()+6)%7;d.setDate(d.getDate()-j);d.setHours(0,0,0,0);return d;}
  if(p==='mois'){return new Date(d.getFullYear(),d.getMonth(),1);}
  return new Date(2000,0,1);}

// ---------- Décor 3D : stade futuriste de nuit ----------
try{(function(){
  const R=new THREE.WebGLRenderer({canvas:$('fond'),antialias:true});
  const S=new THREE.Scene();S.background=new THREE.Color(0x05020f);S.fog=new THREE.FogExp2(0x05020f,.03);
  const C=new THREE.PerspectiveCamera(60,1,.1,200);
  function taille(){R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}
  taille();addEventListener('resize',taille);
  const tc=document.createElement('canvas');tc.width=512;tc.height=320;const x=tc.getContext('2d');
  for(let i=0;i<8;i++){x.fillStyle=i%2?'#0a5c3a':'#0c7a4a';x.fillRect(i*64,0,64,320);}
  x.strokeStyle='#7dfff0';x.lineWidth=3;x.strokeRect(16,16,480,288);x.beginPath();x.moveTo(256,16);x.lineTo(256,304);x.stroke();
  x.beginPath();x.arc(256,160,44,0,7);x.stroke();x.strokeRect(16,100,70,120);x.strokeRect(426,100,70,120);
  const sol=new THREE.Mesh(new THREE.PlaneGeometry(24,15),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(tc)}));
  sol.rotation.x=-Math.PI/2;S.add(sol);
  const neon=[0x00f0ff,0xff2bd6,0x8a3dff,0xb6ff3b,0xffd23f];
  for(let r=0;r<2;r++)for(let i=0;i<56;i++){
    const a=i/56*Math.PI*2,h=1.2+r*1.4;
    const b=new THREE.Mesh(new THREE.BoxGeometry(1.5,h,1),new THREE.MeshBasicMaterial({color:neon[Math.floor(Math.random()*5)]}));
    b.material.color.multiplyScalar(.35+Math.random()*.4);
    b.position.set(Math.cos(a)*(14+r*1.6),h/2+r*.7,Math.sin(a)*(10+r*1.3));b.lookAt(0,b.position.y,0);S.add(b);}
  const faisceaux=[];
  [[1,1],[-1,1],[1,-1],[-1,-1]].forEach((s,k)=>{
    const px=s[0]*16,pz=s[1]*11.5,d=Math.hypot(px,12,pz);
    const tour=new THREE.Mesh(new THREE.CylinderGeometry(.15,.25,12),new THREE.MeshBasicMaterial({color:0x555577}));tour.position.set(px,6,pz);S.add(tour);
    const lampe=new THREE.Mesh(new THREE.BoxGeometry(1.6,.8,.4),new THREE.MeshBasicMaterial({color:0xffffff}));lampe.position.set(px,12.3,pz);S.add(lampe);
    const g=new THREE.ConeGeometry(d*.2,d,24,1,true);g.translate(0,-d/2,0);g.rotateX(-Math.PI/2);
    const f=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:neon[k%2?0:1],transparent:true,opacity:.13,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    f.position.set(px,12,pz);S.add(f);faisceaux.push(f);});
  const anneaux=[0x00f0ff,0xff2bd6,0xb6ff3b].map((c,i)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(2+i*.8,.05,8,64),new THREE.MeshBasicMaterial({color:c}));m.position.y=3;S.add(m);return m;});
  const N=350,pp=new Float32Array(N*3);for(let i=0;i<N;i++){pp[i*3]=(Math.random()-.5)*34;pp[i*3+1]=Math.random()*14;pp[i*3+2]=(Math.random()-.5)*24;}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  S.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xff9bf0,size:.12,transparent:true,opacity:.8})));
  (function boucle(){
    const t=performance.now()/1000;
    C.position.set(Math.cos(t*.1)*8.5,5+Math.sin(t*.3),Math.sin(t*.1)*6.5);C.lookAt(0,1.8,0);
    faisceaux.forEach((f,i)=>f.lookAt(Math.sin(t*.8+i*1.7)*6,0,Math.cos(t*.6+i*1.1)*4));
    anneaux.forEach((m,i)=>{m.rotation.x=t*(.8+i*.3);m.rotation.y=t*.6;});
    for(let i=0;i<N;i++){pp[i*3+1]+=.012;if(pp[i*3+1]>14)pp[i*3+1]=0;}
    pg.attributes.position.needsUpdate=true;
    R.render(S,C);requestAnimationFrame(boucle);})();
})();}catch(e){}

// ---------- Robots 3D : victoire et défaite ----------
let R3,S3,C3,raf,act=[];
function mat(c,e){return new THREE.MeshStandardMaterial({color:c,emissive:e||0,metalness:.5,roughness:.35});}
function robot(c){
  const g=new THREE.Group();
  const corps=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.4,.8),mat(c));corps.position.y=1.2;g.add(corps);
  const tete=new THREE.Group();tete.position.y=2.35;
  tete.add(new THREE.Mesh(new THREE.BoxGeometry(1,.8,.8),mat(0xdddddd)));
  const og=new THREE.SphereGeometry(.12,12,12),om=new THREE.MeshBasicMaterial({color:0x00f0ff});
  [-.25,.25].forEach(x=>{const o=new THREE.Mesh(og,om);o.position.set(x,.05,.41);tete.add(o);});
  const ant=new THREE.Mesh(new THREE.SphereGeometry(.14,12,12),new THREE.MeshBasicMaterial({color:0xff2bd6}));ant.position.y=.65;tete.add(ant);
  g.add(tete);
  const bras=[-1,1].map(s=>{const a=new THREE.Group();a.position.set(s*.85,1.75,0);const m=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,1,10),mat(0xdddddd));m.position.y=-.5;a.add(m);g.add(a);return a;});
  const jambes=[-1,1].map(s=>{const l=new THREE.Group();l.position.set(s*.35,.5,0);const m=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.9,10),mat(0x333344));m.position.y=-.45;l.add(m);g.add(l);return l;});
  g.userData={head:tete,arms:bras,legs:jambes};
  return g;
}
function trophee(){
  const g=new THREE.Group(),o=mat(0xffd23f,0x553300);
  const a=new THREE.Mesh(new THREE.CylinderGeometry(.6,.25,.9,20),o);a.position.y=.9;g.add(a);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.5,10),o);b.position.y=.25;g.add(b);
  const c=new THREE.Mesh(new THREE.BoxGeometry(.7,.15,.7),o);c.position.y=-.05;g.add(c);
  return g;
}
function jouer3d(gagne){
  try{
    if(!R3){R3=new THREE.WebGLRenderer({canvas:$('scene3d'),alpha:true,antialias:true});S3=new THREE.Scene();C3=new THREE.PerspectiveCamera(45,1,.1,100);
      S3.add(new THREE.AmbientLight(0xffffff,.8));
      const a=new THREE.PointLight(0xff2bd6,2.5,40);a.position.set(4,5,6);S3.add(a);
      const b=new THREE.PointLight(0x00f0ff,2.5,40);b.position.set(-5,3,5);S3.add(b);}
    R3.setSize(innerWidth,innerHeight);C3.aspect=innerWidth/innerHeight;C3.updateProjectionMatrix();
    C3.position.set(0,1.5,innerWidth<innerHeight?12:9);C3.lookAt(0,1.2,0);
    act.forEach(o=>S3.remove(o));act=[];
    const rob=robot(gagne?0x8a3dff:0xff4d6d);rob.position.set(-.9,-1.2,0);S3.add(rob);act.push(rob);
    let tr=null,pts=null,vel=[],st=[];
    if(gagne){
      tr=trophee();tr.position.set(1.6,-1.2,0);S3.add(tr);act.push(tr);
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(160*3),3));
      for(let i=0;i<160;i++)vel.push(new THREE.Vector3(Math.random()-.5,Math.random()*.9,Math.random()-.5).normalize().multiplyScalar(1+Math.random()*3));
      pts=new THREE.Points(g,new THREE.PointsMaterial({color:0xffd23f,size:.18,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
      pts.frustumCulled=false;S3.add(pts);act.push(pts);
    }else{
      for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.18),new THREE.MeshBasicMaterial({color:0xffd23f}));S3.add(s);st.push(s);act.push(s);}
    }
    const t0=performance.now();cancelAnimationFrame(raf);
    const boucle=()=>{
      const t=(performance.now()-t0)/1000,u=rob.userData;
      if(gagne){
        rob.position.y=-1.2+Math.abs(Math.sin(t*5))*1.1;rob.rotation.y=t*3;
        u.arms[0].rotation.z=-(Math.PI-.5)+Math.sin(t*12)*.4;u.arms[1].rotation.z=(Math.PI-.5)-Math.sin(t*12)*.4;
        u.head.rotation.z=Math.sin(t*6)*.2;tr.rotation.y=t*2.5;tr.position.y=-1.2+Math.sin(t*3)*.25;
        const q=pts.geometry.attributes.position.array,k=(t%2)*2;
        for(let i=0;i<vel.length;i++){q[i*3]=vel[i].x*k;q[i*3+1]=1+vel[i].y*k;q[i*3+2]=vel[i].z*k;}
        pts.geometry.attributes.position.needsUpdate=true;
      }else{
        const k=Math.min(t,1);
        rob.rotation.z=k*Math.PI/2;rob.position.x=1.8-k*.6;
        rob.position.y=-1.2+(k<1?Math.sin(k*Math.PI)*.8:Math.abs(Math.sin((t-1)*6))*Math.exp(-(t-1)*2)*.6);
        u.legs[0].rotation.x=Math.sin(t*14)*.7;u.legs[1].rotation.x=-Math.sin(t*14)*.7;
        u.arms[0].rotation.z=Math.sin(t*15)*.9;u.arms[1].rotation.z=-Math.sin(t*15)*.9;
        st.forEach((s,i)=>{const a=t*5+i*1.26;s.visible=t>1;s.position.set(rob.position.x-2.35+Math.cos(a)*.7,rob.position.y+.9,Math.sin(a)*.6);s.rotation.y=t*4;});
      }
      R3.render(S3,C3);raf=requestAnimationFrame(boucle);
    };
    boucle();
  }catch(e){}
}
function fermerAnim(){$('anim').style.display='none';cancelAnimationFrame(raf);}
function animation(gagne){
  $('animTexte').textContent=gagne?'Bien joué, pronostic gagné ! ✨':'Aïe… glissade ! Ce sera pour la prochaine 😅';
  $('anim').style.display='block';jouer3d(gagne);
  if(gagne)confetti({particleCount:200,spread:100,origin:{y:.6},colors:['#00f0ff','#ff2bd6','#ffd23f','#b6ff3b'],shapes:['star','circle']});
  setTimeout(fermerAnim,5500);
}

// ---------- Connexion ----------
$('basculer').onclick=()=>{
  modeInscription=!modeInscription;
  $('authTitre').textContent=modeInscription?'Inscription gratuite':'Connexion';
  $('btnAuth').textContent=modeInscription?'Je m’inscris':'Je me connecte';
  $('pseudo').style.display=modeInscription?'block':'none';
  $('basculer').textContent=modeInscription?'J’ai déjà un compte, me connecter':'Pas de compte ? M’inscrire';
};
$('btnAuth').onclick=async()=>{
  const email=$('email').value.trim(),mdp=$('mdp').value,pseudo=$('pseudo').value.trim();
  $('authMsg').textContent='';
  if(modeInscription){
    if(pseudo.length<3){$('authMsg').textContent='Choisis un pseudo de 3 lettres minimum.';return;}
    const {data,error}=await sb.auth.signUp({email,password:mdp});
    if(error){$('authMsg').textContent='Erreur : '+error.message;return;}
    if(!data.session){$('authMsg').textContent='Compte créé. Vérifie tes e-mails pour confirmer, puis connecte-toi.';return;}
    const {error:e2}=await sb.from('profiles').insert({id:data.user.id,pseudo});
    if(e2){$('authMsg').textContent='Pseudo déjà pris ou invalide, essaie un autre.';return;}
  }else{
    const {error}=await sb.auth.signInWithPassword({email,password:mdp});
    if(error){$('authMsg').textContent='Connexion impossible : '+error.message;return;}
  }
  demarrer();
};
$('btnDeco').onclick=async()=>{await sb.auth.signOut();location.reload();};

async function demarrer(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return;
  const {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).single();
  moi=prof?{id:user.id,pseudo:prof.pseudo}:null;
  if(!moi){$('authMsg').textContent='Profil introuvable. Reconnecte-toi ou réinscris-toi.';return;}
  $('vueAuth').classList.add('cache');$('vueApp').classList.remove('cache');$('entete').classList.remove('cache');
  $('monPseudo').textContent='Pseudo : '+moi.pseudo;
  chargerMatchs();chargerChat();
  sb.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>chargerChat()).subscribe();
  const canal=sb.channel('en-ligne',{config:{presence:{key:moi.id}}});
  canal.on('presence',{event:'sync'},()=>{enLigne=Object.keys(canal.presenceState());majMembres();})
    .subscribe(async s=>{if(s==='SUBSCRIBED')await canal.track({pseudo:moi.pseudo});});
}
async function majMembres(){
  if(!profs.length||enLigne.some(i=>!profs.find(p=>p.id===i))){const {data}=await sb.from('profiles').select('id,pseudo');profs=data||[];}
  const on=id=>enLigne.includes(id);
  $('enligne').textContent='🟢 '+enLigne.length+' en ligne';
  $('listeMembres').innerHTML=profs.slice().sort((a,b)=>on(b.id)-on(a.id)||a.pseudo.localeCompare(b.pseudo)).map(p=>`<div class='rang'><div class='point ${on(p.id)?'on':''}'></div><div class='nom'>${echap(p.pseudo)}${p.id===moi.id?' (moi)':''}</div><div class='petit'>${on(p.id)?'en ligne':'hors ligne'}</div></div>`).join('');
}

// ---------- Navigation ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('actif'));b.classList.add('actif');
  ['pageMatchs','pageClassement','pageChat','pageMembres','pageProfil'].forEach(p=>$(p).classList.add('cache'));
  $(b.dataset.page).classList.remove('cache');
  if(b.dataset.page==='pageClassement')chargerClassement();
  if(b.dataset.page==='pageProfil')chargerStat();
  if(b.dataset.page==='pageMembres')majMembres();
});

// ---------- Matchs et pronostics ----------
$('filtreSport').onchange=chargerMatchs;
async function chargerMatchs(){
  let q=sb.from('matches').select('*').order('date_match',{ascending:true});
  if($('filtreSport').value)q=q.eq('sport',$('filtreSport').value);
  const {data:matchs}=await q;
  const {data:mes}=await sb.from('predictions').select('*').eq('user_id',moi.id);
  preds={};(mes||[]).forEach(p=>preds[p.match_id]=p);
  const ic={football:'⚽',basket:'🏀',hockey:'🏒'};
  $('listeMatchs').innerHTML=(matchs||[]).map(m=>{
    const p=preds[m.id],debut=new Date(m.date_match),ferme=m.termine||debut<new Date();
    const date=debut.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
    const dis=ferme?'disabled':'';
    const btn=(v,l)=>`<button class='${p&&p.choix===CH[v]?'sel':''}' ${dis} onclick='choisir(${m.id},${v},this)'>${l}</button>`;
    const sc=(id,val)=>`<input id='${id}${m.id}' type='number' min='0' inputmode='numeric' placeholder='Score' value='${val==null?'':val}' ${dis}>`;
    const saisie=ferme?'':`<div class='score'>${sc('sd',p&&p.score_dom)}<b>-</b>${sc('se',p&&p.score_ext)}</div><button class='gros' onclick='valider(${m.id})'>Valider mon pronostic</button>`;
    const deja=p?`<div class='petit'>✅ Pronostic validé${p.score_dom!=null?' : '+p.score_dom+' - '+p.score_ext:''}</div>`:'';
    const fin=m.termine?`<div class='petit'>Score final : ${m.score_domicile} - ${m.score_exterieur}</div>`+(p?`<div class='petit'>${p.points>0?'✅ +'+p.points+' points':'❌ 0 point'}</div>`:''):'';
    const adm=(!m.termine&&debut<new Date())?`<button class='lien' onclick='saisirScore(${m.id})'>Saisir le score final</button>`:'';
    return `<div class='card match'><div class='titre'><span>${ic[m.sport]} ${echap(m.equipe_domicile)} – ${echap(m.equipe_exterieur)}</span><span class='badge'>${echap(m.competition||m.sport)}</span></div><div class='petit'>${date}</div><div class='choix'>${btn(1,'1 (dom.)')}${btn(0,'Nul')}${btn(2,'2 (ext.)')}</div>${saisie}${deja}${fin}${adm}</div>`;
  }).join('')||`<div class='card'>Aucun match pour l’instant. Ajoute le premier ci-dessous !</div>`;
}
window.choisir=(id,v,b)=>{brouillon[id]=CH[v];b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
window.valider=async id=>{
  const choix=brouillon[id]||(preds[id]&&preds[id].choix);
  if(!choix){alert('Choisis d’abord 1, Nul ou 2.');return;}
  const a=$('sd'+id).value,b=$('se'+id).value;
  if((a===''&&b!=='')||(a!==''&&b==='')){alert('Remplis les deux cases du score, ou aucune.');return;}
  const d=a===''?null:parseInt(a),e=b===''?null:parseInt(b);
  if(d!==null&&(d>e?'domicile':d<e?'exterieur':'nul')!==choix){alert('Ton score ne correspond pas à ton choix.');return;}
  const {error}=await sb.from('predictions').upsert({user_id:moi.id,match_id:id,choix,score_dom:d,score_ext:e},{onConflict:'user_id,match_id'});
  if(error){alert('Impossible : '+error.message);return;}
  confetti({particleCount:70,spread:70,origin:{y:.7},colors:['#00f0ff','#ff2bd6']});
  chargerMatchs();
};
$('btnAjoutMatch').onclick=async()=>{
  const m={sport:$('nvSport').value,competition:$('nvComp').value,equipe_domicile:$('nvDom').value.trim(),equipe_exterieur:$('nvExt').value.trim(),date_match:$('nvDate').value};
  if(!m.equipe_domicile||!m.equipe_exterieur||!m.date_match){alert('Remplis les équipes et la date.');return;}
  const {error}=await sb.from('matches').insert(m);
  if(error){alert('Match non ajouté : '+error.message);return;}
  ['nvComp','nvDom','nvExt','nvDate'].forEach(i=>$(i).value='');chargerMatchs();
};
window.saisirScore=async id=>{
  const d=parseInt(prompt('Buts / points de l’équipe à domicile ?')),e=parseInt(prompt('Buts / points de l’équipe à l’extérieur ?'));
  if(isNaN(d)||isNaN(e))return;
  const {error}=await sb.rpc('cloturer_match',{p_match:id,p_dom:d,p_ext:e});
  if(error){alert('Clôture impossible : '+error.message);return;}
  const {data}=await sb.from('predictions').select('*').eq('match_id',id).eq('user_id',moi.id).maybeSingle();
  if(data)animation(data.points>0);
  chargerMatchs();
};

// ---------- Classement et graphiques ----------
['Semaine','Mois','Tout'].forEach(n=>$('ong'+n).onclick=()=>{
  periode=n.toLowerCase();
  ['Semaine','Mois','Tout'].forEach(x=>$('ong'+x).classList.remove('actif'));$('ong'+n).classList.add('actif');
  chargerClassement();
});
async function chargerClassement(){
  const debut=debutPeriode(periode).toISOString();
  const {data:pr}=await sb.from('predictions').select('user_id,points,created_at').gte('created_at',debut);
  const {data:ps}=await sb.from('profiles').select('id,pseudo');
  const nom={};(ps||[]).forEach(p=>nom[p.id]=p.pseudo);
  const tot={};(pr||[]).forEach(p=>tot[p.user_id]=(tot[p.user_id]||0)+(p.points||0));
  (ps||[]).forEach(p=>{if(!(p.id in tot))tot[p.id]=0;});
  const liste=Object.entries(tot).sort((a,b)=>b[1]-a[1]),med=['🥇','🥈','🥉'];
  $('classement').innerHTML=liste.map(([id,pts],i)=>`<div class='rang'><div class='num'>${med[i]||i+1}</div><div class='nom'>${echap(nom[id]||'?')}${id===moi.id?' (moi)':''}</div><div class='pts'>${pts} pts</div></div>`).join('');
  const top=liste.slice(0,8),ax={ticks:{color:'#eaf6ff'},grid:{color:'#ffffff18'}};
  if(graphA)graphA.destroy();
  graphA=new Chart($('graph'),{type:'bar',data:{labels:top.map(x=>nom[x[0]]),datasets:[{label:'Points',data:top.map(x=>x[1]),backgroundColor:['#00f0ff','#ff2bd6','#ffd23f','#b6ff3b','#8a3dff','#ff9f4d','#4dc3ff','#ff4d6d']}]},options:{plugins:{legend:{display:false}},scales:{x:ax,y:{...ax,beginAtZero:true}}}});
  const jours={};(pr||[]).forEach(p=>{const j=p.created_at.slice(0,10);jours[j]=jours[j]||{};jours[j][p.user_id]=(jours[j][p.user_id]||0)+(p.points||0);});
  const ordre=Object.keys(jours).sort(),cou=['#ffd23f','#ff2bd6','#00f0ff'];
  const series=liste.slice(0,3).map(([id],k)=>{let c=0;return{label:nom[id],borderColor:cou[k],backgroundColor:cou[k],tension:.35,data:ordre.map(j=>c+=(jours[j][id]||0))};});
  if(graphB)graphB.destroy();
  graphB=new Chart($('graphTendance'),{type:'line',data:{labels:ordre.map(j=>j.slice(5)),datasets:series},options:{plugins:{legend:{labels:{color:'#eaf6ff'}}},scales:{x:ax,y:{...ax,beginAtZero:true}}}});
}
async function chargerStat(){
  const {data}=await sb.from('predictions').select('points').eq('user_id',moi.id);
  const n=(data||[]).length,g=(data||[]).filter(p=>p.points>0).length,pts=(data||[]).reduce((s,p)=>s+(p.points||0),0);
  $('monStat').textContent=n?`${n} pronostics, ${g} gagnés (${Math.round(100*g/n)} %), ${pts} points au total`:'Pas encore de pronostic.';
}

// ---------- Chat ----------
async function chargerChat(){
  const {data:msgs}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(60);
  const {data:ps}=await sb.from('profiles').select('id,pseudo');
  const nom={};(ps||[]).forEach(p=>nom[p.id]=p.pseudo);
  const masques=JSON.parse(localStorage.getItem('masques')||'[]');
  $('chatBox').innerHTML=(msgs||[]).reverse().filter(m=>!masques.includes(m.id)).map(m=>`<div class='msg ${m.user_id===moi.id?'moi':''}'><b>${echap(nom[m.user_id]||'?')}</b>${echap(m.contenu)}${m.user_id!==moi.id?` <button class='sig' onclick='masquer(${m.id})'>masquer</button>`:''}</div>`).join('');
  $('chatBox').scrollTop=$('chatBox').scrollHeight;
}
window.masquer=id=>{const l=JSON.parse(localStorage.getItem('masques')||'[]');l.push(id);localStorage.setItem('masques',JSON.stringify(l));chargerChat();};
$('chatEnvoi').onclick=async()=>{
  const t=$('chatTexte').value.trim();if(!t)return;
  const {error}=await sb.from('messages').insert({user_id:moi.id,contenu:t});
  if(error){alert('Message non envoyé : '+error.message);return;}
  $('chatTexte').value='';chargerChat();
};
$('chatTexte').addEventListener('keydown',e=>{if(e.key==='Enter')$('chatEnvoi').click();});

(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)demarrer();})();
</script>
