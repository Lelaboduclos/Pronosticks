<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#030211;font-family:system-ui,sans-serif;color:#fff}

@keyframes respire{50%{filter:brightness(1.12) saturate(1.1)}}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.12) 50%,transparent 58%);background-size:260% 100%;animation:eclat 7s linear infinite}

.z{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.45cqw;line-height:1.15;color:#fff}
.z small{font-size:1cqw;opacity:.85;display:block}
.patch{background:rgba(5,12,36,.95);border:1px solid #2aa6d8;border-radius:.7cqw;box-shadow:0 0 .8cqw #29d8ff55}
.patch2{background:rgba(36,62,90,.97);border-radius:.8cqw}
.pnl{background:rgba(6,20,60,.97);border:1px solid #2ab4ff;border-radius:1cqw;flex-direction:column;gap:.6cqw;padding:1cqw}
.champ{background:rgba(9,22,48,.97);border-radius:.8cqw}
.tx{font-weight:800;font-size:2.1cqw;text-shadow:0 0 .8cqw #000}
.z input,.z select{width:100%;height:100%;background:transparent;border:0;outline:0;color:#fff;font-size:max(16px,1.5cqw);padding:0 1cqw;text-align:left;color-scheme:dark}
.z select{text-align:center;text-align-last:center;font-weight:700}
.z select option{background:#071433}
.big input{text-align:center;font-size:max(16px,2cqw);font-weight:800}
.nom input{text-align:center;font-weight:800;font-size:max(16px,1.9cqw)}
.btn{cursor:pointer;border-radius:1cqw}
.btn:hover{box-shadow:inset 0 0 1.4cqw #ffd34d}
.btn:active{background:rgba(255,255,255,.2)}
.sel{box-shadow:inset 0 0 1.6cqw #ffd34d,0 0 1.2cqw #ffd34d}
.gbtn{background:linear-gradient(90deg,#ff3d9a,#3d8bff);font-weight:800;font-size:2cqw;border-radius:2cqw}
.ckb{background:rgba(9,22,48,.9);border:1px solid #29d8ff;border-radius:.4cqw;cursor:pointer}
.ckb.on:after{content:"✓";color:#29d8ff;font-size:2cqw}
.col{flex-direction:column;justify-content:flex-start;align-items:stretch;overflow:auto;padding:.6cqw .8cqw;text-align:left;gap:.5cqw}
.it{display:flex;align-items:center;gap:.8cqw;font-size:1.5cqw}
.it small{margin-left:auto}
.it i{width:1.1cqw;height:1.1cqw;border-radius:50%;background:#666;flex:none}
.it i.v{background:#00ff9d;box-shadow:0 0 .6cqw #00ff9d}
.ms{background:rgba(30,60,100,.55);border-radius:.8cqw;padding:.5cqw .9cqw;font-size:1.35cqw}
.clk{flex-direction:column}
.clk b{font-size:3.2cqw;color:#7df1ff}
.mini{flex-direction:row!important;gap:.8cqw}
.mini b{font-size:1.25cqw}
.mini small{font-size:1.1cqw}
.row{font-size:1.25cqw;justify-content:space-between;padding:0 .6cqw}
#mbtn{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;width:46px;height:46px;border-radius:50%;background:rgba(5,12,36,.85);border:1px solid #2aa6d8;color:#fff;font-size:1.3rem;cursor:pointer;display:none}
#menu{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));z-index:7;background:rgba(5,12,36,.96);border:1px solid #2aa6d8;border-radius:14px;padding:10px;display:none;flex-direction:column;gap:6px;min-width:200px}
#menu button{background:#0b1f4d;border:1px solid #2aa6d8;color:#fff;border-radius:10px;padding:9px;font-size:.95rem;text-align:left;cursor:pointer}
#menu button.on{border-color:#ffd34d}
#mclk{font-size:.75rem;color:#bfeaff;text-align:center;padding-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;background:rgba(5,12,36,.96);border:1px solid #29d8ff;border-radius:12px;padding:10px 16px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.ko{border-color:#ff5470;color:#ffb4c0}
#etincelles{position:fixed;inset:0;z-index:2;pointer-events:none}
#modal{display:none;position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:12px}
.pn{background:rgba(6,16,46,.97);border:2px solid #3fc8ff;border-radius:16px;box-shadow:0 0 24px #29d8ff88;padding:16px;width:min(440px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.pn input{width:100%;padding:10px;border-radius:10px;border:1px solid #3fc8ff;background:#050d2a;color:#fff;font-size:16px}
.pn button{padding:10px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:#1b4f9c;color:#fff}
.pn .or{background:#ffd34d;color:#321}
.pn .rouge{background:#c0364f}
.lg{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lg button{padding:6px 10px;font-size:.8rem}
.rw{background:#0b1f4d;border:1px solid #2aa6d8;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 10px;font-size:.8rem}
.chips button.on{background:#ffd34d;color:#321}
#mob{display:none;position:fixed;inset:0;z-index:1}
body.port #mob{display:block}
body.port #vue,body.port #mbtn,body.port #menu{display:none!important}
body.port #flou{filter:blur(5px) brightness(.42)}
#mobc{height:100%;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 14px 90px;-webkit-overflow-scrolling:touch}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hd img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 14px #ff3df2,0 0 28px #29d8ff88}
.hd h1{font-size:1.15rem;font-style:italic;background:linear-gradient(90deg,#29d8ff,#ff3df2,#ffd34d);-webkit-background-clip:text;color:transparent}
.hd small{margin-left:auto;color:#bfeaff;font-size:.68rem;text-align:right}
.ti{font-size:1.1rem;margin:8px 0;text-align:center;text-shadow:0 0 10px #29d8ff}
.cd{background:rgba(6,10,34,.82);border:1.5px solid #3fc8ff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 0 18px #29d8ff55,inset 0 0 18px #a02bff22;backdrop-filter:blur(4px)}
.cd.or{border-color:#ffd34d;box-shadow:0 0 18px #ffd34d66,inset 0 0 18px #ffd34d18}
.cd h3{font-size:.95rem;margin-bottom:8px;color:#ffd34d}
.cd small{color:#bcd;font-size:.78rem}
.mob input:not([type=checkbox]),.mob select{width:100%;padding:12px;margin:5px 0;border-radius:12px;border:1.5px solid #8a2be2;background:#050218;color:#fff;font-size:16px;color-scheme:dark}
.mob input:focus,.mob select:focus{outline:0;border-color:#29d8ff;box-shadow:0 0 12px #29d8ff}
.mob button{padding:12px 14px;border:0;border-radius:12px;font-weight:800;cursor:pointer;color:#fff;background:#12307a;font-size:.9rem}
.mob button:disabled{opacity:.45}
.bt{width:100%;background:linear-gradient(90deg,#ff3d9a,#3d8bff)!important;font-size:1.05rem!important;margin-top:8px;box-shadow:0 0 16px #ff3df288}
.bo{background:linear-gradient(90deg,#ffd34d,#ffb000)!important;color:#321!important}
.bg{width:100%;background:rgba(5,12,36,.7)!important;border:1px solid #2aa6d8!important;margin:6px 0}
.mob .rouge{background:#c0364f;width:100%;margin-top:6px}
.lk{background:none!important;text-decoration:underline;color:#ffd34d!important;font-weight:400!important;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.mob .chips button{padding:7px 11px;font-size:.8rem}
.mob .chips button.on{background:#ffd34d;color:#321}
.tm{display:flex;align-items:center;justify-content:space-between;text-align:center;gap:8px;margin:10px 0}
.tm>div{flex:1}.tm b{font-size:1.1rem;display:block}.tm small{display:block;color:#ffd34d}
.tm span{font-weight:900;color:#ff3df2;font-size:1.3rem;text-shadow:0 0 10px #ff3df2}
.r3{display:flex;gap:6px;margin-bottom:6px}
.mob .r3 .rb{flex:1;font-size:.78rem;padding:11px 4px;border:1.5px solid #3fc8ff}
.mob .rb.sel{background:#ffd34d;color:#321;box-shadow:0 0 12px #ffd34d}
.lb{background:rgba(30,60,100,.5);border-radius:12px;padding:10px;margin:6px 0;font-size:.9rem;line-height:1.5}
.why{font-size:.8rem;color:#cde;margin-top:6px}
.mt{cursor:pointer}
.rgl{display:flex;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
.mob .lg input{flex:1}
.bar{position:sticky;bottom:0;background:rgba(5,8,28,.9);padding:6px;border-radius:14px}
#tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(5,8,28,.94);border-top:1px solid #2aa6d8;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
body.port.in #tabs{display:flex}
#tabs button{background:none;border:0;color:#cfe;font-size:1.35rem;display:flex;flex-direction:column;align-items:center;padding:4px 10px;border-radius:10px;cursor:pointer}
#tabs small{font-size:.6rem}
#tabs button.on{color:#ffd34d;text-shadow:0 0 10px #ffd34d}
@media(prefers-reduced-motion:reduce){#stage,#stage:after{animation:none}}
</style>
</head>
<body>
<div id="flou"></div>
<div id="vue"><div id="stage"><img id="art" alt="Le Labo du Clos"><div id="zones"></div></div></div>
<canvas id="etincelles"></canvas>
<div id="mob"><div id="mobc" class="mob"></div></div>
<div id="tabs">
  <button data-t="jour" onclick="go('jour')">📅<small>Matchs</small></button>
  <button data-t="nouveau" onclick="go('nouveau')">➕<small>Ajouter</small></button>
  <button data-t="chat" onclick="go('chat')">💬<small>Chat</small></button>
  <button data-t="concours" onclick="go('concours')">🏆<small>Concours</small></button>
  <button data-t="profil" onclick="go('profil')">👤<small>Profil</small></button>
</div>
<button id="mbtn">☰</button>
<div id="menu">
  <div id="mclk"></div>
  <button data-p="match">⚽ Matchs</button>
  <button id="mlist">📋 Tous les matchs</button>
  <button data-p="chat">💬 Chat</button>
  <button data-p="concours">🏆 Concours</button>
  <button data-p="profil">👤 Mon profil</button>
  <button id="mnew">➕ Ajouter un match</button>
  <button id="madm" style="display:none">⚙️ Administration</button>
  <button id="mmus">🔇 Musique</button>
  <button id="deco">⏻ Quitter</button>
</div>
<div id="toast"></div>
<div id="modal"></div>

<script>
const sb=supabase.createClient("https://herjmwgirdrpfawwsfec.supabase.co","sb_publishable_1-d455iPyqKCBsK-s70tjA_0e-l8hEh");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SPORTS=['Foot','Basket','Tennis','Hockey','Rugby','Volley','Autre'];
let U=null,PR={},page='',mode='ins',timers=[],hb,ckz,CR,MS=[],mi=0,ch=null,creation=false,curId=null;
const nomU=()=>PR.pseudo||(U&&U.email.split('@')[0])||'Joueur';
const isAdmin=()=>PR.role==='admin';

// ---- Sons et musique (générés par le navigateur) ----
let ctx;
function son(f,d=0.12){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  f.forEach((x,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*d;
  o.type='sine';o.frequency.value=x;g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d);});}catch(e){}}
const sonValide=()=>{son([660,880,1320,1760],0.1);try{const u=new SpeechSynthesisUtterance('Parfait !');u.lang='fr-FR';speechSynthesis.speak(u);}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest('.btn,.gbtn,.ckb,button'))son([880,1320])});
let mu=false,tm,ni=0;const nt=[262,330,392,330,294,370,440,370];
function musique(){mu=!mu;clearInterval(tm);if(mu)tm=setInterval(()=>son([nt[ni++%8]],0.5),500);$('mmus').textContent=(mu?'♫':'🔇')+' Musique';}
$('mmus').onclick=musique;

// ---- Messages, horloge, fenêtres ----
let tt;
function toast(m,ko){const t=$('toast');t.textContent=m;t.className=ko?'on ko':'on';clearTimeout(tt);tt=setTimeout(()=>t.className='',3000);
  if(ko){const z=$('zones');z.classList.remove('tremble');void z.offsetWidth;z.classList.add('tremble');}}
const soon=()=>toast('Bientôt disponible ✨');
function tick(){const d=new Date(),h=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
  j=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.querySelectorAll('.clk').forEach(e=>e.innerHTML='<b>'+h+'</b><small>'+j+'</small>');
  $('mclk').textContent=j+' · '+h;document.querySelectorAll('.hclk').forEach(e=>e.innerHTML=j+'<br>'+h);}
setInterval(tick,1000);
function modal(h){const m=$('modal');m.innerHTML='<div class="pn">'+h+'<button onclick="$(\'modal\').style.display=\'none\'">Fermer</button></div>';m.style.display='flex';}

// ---- Zones posées sur l'illustration (coordonnées du dessin d'origine) ----
const FW=1604;let FH=875,OY=710;
function Z(x1,y1,x2,y2,cls,html,fn){const d=document.createElement('div');d.className='z '+(cls||'');
  d.style.cssText='left:'+x1/FW*100+'%;top:'+(y1-OY)/FH*100+'%;width:'+(x2-x1)/FW*100+'%;height:'+(y2-y1)/FH*100+'%';
  if(html!=null)d.innerHTML=html;if(fn){d.classList.add('btn');d.onclick=fn;}$('zones').appendChild(d);return d;}

// ---- Navigation entre les pages ----
const PG={accueil:{img:'accueil.webp',fn:accueilPg,fx:.84},match:{img:'match.webp',fn:matchPg,fx:.5,fh:902,oy:697},chat:{img:'chat.webp',fn:chatPg,fx:.6},concours:{img:'concours.webp',fn:concoursPg,fx:.5},profil:{img:'profil.webp',fn:profilPg,fx:.5}};
function go(p){timers.forEach(clearInterval);timers=[];$('zones').innerHTML='';
  const pt=PORT();document.body.classList.toggle('port',pt);document.body.classList.toggle('in',!!U&&p!=='accueil');
  if(!pt){if(p==='jour')p='match';if(p==='nouveau'){p='match';creation=true;}}
  page=p;if(pt)return mob(p);
  FH=PG[p].fh||875;OY=PG[p].oy||710;$('stage').style.setProperty('--R',(FW/FH).toFixed(4));
  $('art').src=PG[p].img;$('flou').style.backgroundImage='url('+PG[p].img+')';
  $('mbtn').style.display=U&&p!=='accueil'?'block':'none';$('menu').style.display='none';
  $('madm').style.display=isAdmin()?'block':'none';
  document.querySelectorAll('#menu [data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  PG[p].fn();tick();
  const v=$('vue');v.scrollTo({left:PG[p].fx*v.scrollWidth-v.clientWidth/2,behavior:'smooth'});
  if(v.scrollWidth>v.clientWidth+5&&!window.indice){window.indice=1;setTimeout(()=>toast('Fais glisser l\'écran ↔ pour te déplacer'),600);}}
$('mbtn').onclick=()=>{const m=$('menu');m.style.display=m.style.display==='flex'?'none':'flex';};
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='deco')return sortir();if(b.id==='mmus')return;
  $('menu').style.display='none';
  if(b.id==='mlist')return listeMatchs();
  if(b.id==='mnew'){creation=true;return go('match');}
  if(b.id==='madm')return adminModal();
  creation=false;go(b.dataset.p);};

// ---- Accueil : inscription / connexion ----
function accueilPg(){
  Z(1172,993,1470,1035,'champ','<input id="em" type="email" placeholder="Entrez votre e-mail" autocomplete="email">');
  Z(1172,1083,1470,1125,'champ','<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">');
  Z(1470,1083,1513,1125,'',null,()=>{const i=$('pw');i.type=i.type==='password'?'text':'password';});
  Z(1365,1130,1514,1152,'',null,oubli);
  if(mode==='ins'){
    Z(1172,1191,1470,1233,'champ','<input id="pw2" type="password" placeholder="Répétez le mot de passe">');
    ckz=Z(1160,1252,1188,1282,'ckb','');ckz.onclick=()=>ckz.classList.toggle('on');
    Z(1304,1250,1397,1276,'',null,soon);
  }else Z(1155,1160,1520,1305,'patch2','');
  Z(1160,1320,1513,1372,'gbtn',mode==='ins'?"S'INSCRIRE":'SE CONNECTER',valider);
  Z(1160,1385,1513,1424,'patch2',mode==='ins'?'Déjà un compte ? <u>Se connecter</u>':"Pas de compte ? <u>S'inscrire</u>",()=>{mode=mode==='ins'?'con':'ins';go('accueil');});
  Z(1435,1526,1570,1564,'',null,musique);
  Z(1272,741,1551,850,'patch clk');
  const B=Z(93,1345,477,1437,'patch col','<small>Chargement…</small>');
  const mois=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).toUpperCase();
  sb.from('profiles').select('pseudo,points_mois').order('points_mois',{ascending:false,nullsFirst:false}).limit(1).then(({data})=>{
    const r=(data||[])[0];if(page==='accueil')B.innerHTML='<small>MEILLEUR PRONOSTIQUEUR · '+mois+'</small><b>'+(r?esc(r.pseudo||'—'):'—')+'</b><small>'+(r?r.points_mois||0:0)+' points</small>';});
}
async function valider(){
  const e=$('em').value.trim(),p=$('pw').value;
  if(!e||p.length<6)return toast('E-mail et mot de passe (6 caractères minimum) requis',1);
  if(mode==='ins'){
    if(p!==$('pw2').value)return toast('Les deux mots de passe sont différents',1);
    if(!(PORT()?$('ck').checked:ckz.classList.contains('on')))return toast('Accepte le règlement pour continuer',1);
    const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{pseudo:e.split('@')[0]}}});
    if(error)return toast(error.message,1);
  }else{
    const {error}=await sb.auth.signInWithPassword({email:e,password:p});
    if(error)return toast('Mot de passe ou e-mail incorrect.',1);
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return toast('Compte créé : confirme ton e-mail, puis connecte-toi.');
  sonValide();entrer();
}
async function oubli(){const e=$('em').value.trim();if(!e)return toast("Écris d'abord ton e-mail",1);
  await sb.auth.resetPasswordForEmail(e);toast('E-mail de réinitialisation envoyé ✉️');}
async function entrer(){
  const {data:{user}}=await sb.auth.getUser();if(!user)return false;U=user;
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  const now=new Date().toISOString();
  if(p){PR=p;await sb.from('profiles').update({en_ligne:true,last_seen:now}).eq('id',user.id);}
  else{PR={pseudo:(user.user_metadata&&user.user_metadata.pseudo)||user.email.split('@')[0]};await sb.from('profiles').insert({id:user.id,pseudo:PR.pseudo,en_ligne:true,last_seen:now});}
  clearInterval(hb);hb=setInterval(()=>sb.from('profiles').update({en_ligne:true,last_seen:new Date().toISOString()}).eq('id',U.id),60000);

   '<div class="chips">'+['Tous'].concat(SPORTS).map(k=>cb((IC[k]||'📋')+' '+k,T===k,"T='"+k+"';go('jour')")).join('')+'</div>'+
   (L.map(({m,i})=>'<div class="cd mt" onclick="ouvrirM('+i+')"><div class="lg"><small>🕒 '+fdate(m)+'</small><small>'+(IC[m.sport]||'🎯')+' '+esc(m.sport||'')+'</small></div><div class="tm"><div><b>'+esc(m.equipe1)+'</b>'+rk(m,'dom')+'</div><span>VS</span><div><b>'+esc(m.equipe2)+'</b>'+rk(m,'ext')+'</div></div><div class="lg"><small>'+(lab[m.id]?'🤖 Labo : '+esc(lab[m.id]):'')+'</small><b>'+(m.termine?m.score_dom+'-'+m.score_ext:(mes.has(String(m.id))?'✓ pronostiqué':''))+'</b></div></div>').join('')||"<div class=\"cd\"><small>Aucun match ici pour l'instant. Appuie sur ➕ pour en ajouter un.</small></div>");
}
async function mMatch(c,H){
  if(!MS.length)await chargerMS();
  const i=curId?MS.findIndex(x=>x.id===curId):-1;if(i<0)return go('jour');
  mi=i;const m=MS[i];
  const [{data:pr},lh]=await Promise.all([sb.from('pronostics').select('*').eq('match_id',String(m.id)).eq('user_id',U.id).maybeSingle(),laboH(m.id)]);
  if(page!=='match')return;
  ch=pr?pr.choix:null;const sc=pr&&pr.score_prevu?pr.score_prevu.split('-'):['',''],lock=fini(m);
  c.innerHTML=H()+'<button class="bg" onclick="go(\'jour\')">◀ Tous les matchs</button>'+
  '<div class="cd or"><div class="lg"><small>🕒 '+fdate(m)+'</small><small>'+(IC[m.sport]||'🎯')+' '+esc(m.sport||'')+(m.ligue?' · '+esc(m.ligue):'')+'</small></div>'+
  '<div class="tm"><div><b>'+esc(m.equipe1)+'</b>'+rk(m,'dom')+'</div><span>VS</span><div><b>'+esc(m.equipe2)+'</b>'+rk(m,'ext')+'</div></div>'+
  (m.cote_dom?'<small>📊 Cotes moyennes : 1 → '+m.cote_dom+(m.cote_nul?' · N → '+m.cote_nul:'')+' · 2 → '+m.cote_ext+'</small><br>':'')+(m.meteo?'<small>'+esc(m.meteo)+'</small>':'')+(m.termine?'<h3>Terminé : '+m.score_dom+' - '+m.score_ext+'</h3>':'')+'</div>'+
  '<div class="cd"><h3>🎯 Mon pronostic</h3><div class="r3">'+[['1','Victoire DOM'],['N','Match nul'],['2','Victoire EXT']].map(([v,t])=>'<button class="rb'+(ch===v?' sel':'')+'" data-v="'+v+'" onclick="pick(this)">'+t+'</button>').join('')+'</div>'+
  '<div class="lg"><input id="s1" inputmode="numeric" maxlength="2" placeholder="Score dom." value="'+esc(sc[0])+'"><input id="s2" inputmode="numeric" maxlength="2" placeholder="Score ext." value="'+esc(sc[1])+'"></div>'+
  '<select id="mt"><option value="">Mi-temps : je ne sais pas</option>'+[['1','Mi-temps : Dom. mène'],['N','Mi-temps : Nul'],['2','Mi-temps : Ext. mène']].map(([v,t])=>'<option value="'+v+'"'+(pr&&pr.mi_temps===v?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
  '<input id="bt" placeholder="Butteur marquant" value="'+esc(pr&&pr.buteurs)+'"><input id="df" inputmode="numeric" placeholder="Différence de buts" value="'+esc(pr&&pr.diff_buts)+'">'+
  '<button class="bt" onclick="enregistrer(MS[mi])"'+(lock?' disabled':'')+'>VALIDER MON PRONOSTIC</button>'+(lock?'<small>Match commencé : pronostic fermé.</small>':'')+'</div>'+
  '<div class="cd"><h3>🤖 Pronostic du Labo</h3>'+lh+'<small>Estimation indicative, pas un conseil de paris.</small></div>'+
  (isAdmin()?'<div class="cd"><h3>⚙️ Administrateur</h3><div class="lg"><input id="rd" inputmode="numeric" placeholder="Buts dom."><input id="re" inputmode="numeric" placeholder="Buts ext."></div><select id="rm"><option value="">Mi-temps réelle</option><option value="1">Dom. mène</option><option value="N">Nul</option><option value="2">Ext. mène</option></select><input id="rb" placeholder="Buteurs (séparés par des virgules)"><button class="bo" style="width:100%" onclick="resultat()">Valider le résultat</button><button class="rouge" onclick="supprimer()">Supprimer ce match</button></div>':'');
}
function mNouveau(c,H){
  c.innerHTML=H('Ajouter un match')+'<div class="cd"><h3>➕ Nouveau match</h3><select id="sp">'+SPORTS.map(s=>'<option>'+s+'</option>').join('')+'</select><input id="e1" placeholder="Équipe domicile" maxlength="24"><input id="e2" placeholder="Équipe extérieure" maxlength="24"><input id="dt" type="datetime-local"><button class="bt" onclick="creer()">AJOUTER CE MATCH</button><small>Tous les membres pourront pronostiquer dessus.</small></div>';
}
function mChat(c,H){
  c.innerHTML=H('Salon de discussion')+'<div class="cd"><small id="on">…</small></div><div class="cd" id="msgs" style="height:44vh;overflow:auto"></div><div class="lg bar"><input id="msg" placeholder="Écrire un message…" maxlength="300"><button class="bo" onclick="envoyer()">➤</button></div>';
  $('msg').onkeydown=e=>{if(e.key==='Enter')envoyer();};
  CR=async()=>{
    const [pf,ms]=await Promise.all([sb.from('profiles').select('pseudo,en_ligne,last_seen'),sb.from('messages').select('*').order('created_at',{ascending:false}).limit(30)]);
    if(page!=='chat')return;
    const P=pf.data||[],on=p=>p.en_ligne&&p.last_seen&&Date.now()-new Date(p.last_seen)<180000,O=P.filter(on);
    $('on').innerHTML='<b>'+O.length+'/'+P.length+' en ligne</b> · '+(O.map(p=>'🟢 '+esc(p.pseudo||'?')).join(' · ')||'personne');
    const M=$('msgs');M.innerHTML=(ms.data||[]).reverse().map(x=>'<div class="ms"><b>'+esc(x.pseudo||'?')+'</b> <small>'+new Date(x.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</small><br>'+esc(x.contenu)+'</div>').join('')||'<small>Aucun message. Écris le premier !</small>';
    M.scrollTop=M.scrollHeight;};
  CR();timers.push(setInterval(CR,4000));
}
async function mConc(c,H){
  c.innerHTML=H('Concours du meilleur pronostiqueur')+'<div class="cd"><small>Chargement…</small></div>';
  const [w,mo,y,lb]=await Promise.all([topN('points_semaine',3),topN('points_mois',3),topN('points',3),sb.from('labo_pronos').select('type,points')]);
  if(page!=='concours')return;
  const bot={};(lb.data||[]).forEach(x=>bot[x.type]=(bot[x.type]||0)+(x.points||0));
  const lst=(L,k)=>L.map((r,i)=>'<div class="lg"><span>'+['🥇','🥈','🥉'][i]+' '+esc(r.pseudo||'—')+'</span><b>'+(r[k]||0)+' pts</b></div>').join('')||'<small>—</small>';
  c.innerHTML=H('Concours du meilleur pronostiqueur')+
   '<div class="cd"><h3>🏅 Meilleur joueur de la semaine</h3>'+lst(w,'points_semaine')+'</div>'+
   '<div class="cd"><h3>🏅 Meilleur joueur du mois</h3>'+lst(mo,'points_mois')+'</div>'+
   '<div class="cd or"><h3>🏆 Meilleur joueur de l\'année</h3>'+lst(y,'points')+'<small>Trophée du Ticket d\'Or · grande cérémonie de remise des prix le 1er décembre</small></div>'+
   '<div class="cd"><h3>🤖 Le Labo Bot</h3><div class="lg"><span>🛡️ Prudent</span><b>'+(bot.prudent||0)+' pts</b></div><div class="lg"><span>🔥 Audacieux</span><b>'+(bot.audacieux||0)+' pts</b></div></div>';
}
async function mProfil(c,H){
  c.innerHTML=H('Mon compte')+'<div class="cd"><small>Chargement…</small></div>';
  const [cc,l,n]=await Promise.all([
    sb.from('profiles').select('id',{count:'exact',head:true}),
    sb.from('pronostics').select('created_at').eq('user_id',U.id).order('created_at',{ascending:false}).limit(1),
    sb.from('pronostics').select('id',{count:'exact',head:true}).eq('user_id',U.id)]);
  if(page!=='profil')return;
  c.innerHTML=H('Mon compte')+'<div class="cd or"><h3>👤 Pseudo</h3><input id="ps" maxlength="20" value="'+esc(nomU())+'"><button class="bo" style="width:100%" onclick="savePseudo($(\'ps\').value)">Enregistrer</button></div>'+
   '<div class="cd"><div class="lg"><span>Membre depuis</span><b>'+new Date(U.created_at).toLocaleDateString('fr-FR')+'</b></div><div class="lg"><span>Points</span><b>'+(PR.points||0)+'</b></div><div class="lg"><span>Amis</span><b>'+Math.max(0,(cc.count||1)-1)+'</b></div><div class="lg"><span>Dernier pronostic</span><b>'+(l.data&&l.data[0]?new Date(l.data[0].created_at).toLocaleDateString('fr-FR'):'—')+'</b></div><div class="lg"><span>Niveau d\'activité</span><b>Niv. '+(1+Math.floor((n.count||0)/5))+'</b></div></div>'+
   (isAdmin()?'<button class="bo" style="width:100%" onclick="adminModal()">⚙️ Administration (membres, résultats)</button>':'')+
   '<button class="bg" onclick="musique()">'+(mu?'♫':'🔇')+' Musique</button><button class="rouge" onclick="sortir()">⏻ Se déconnecter</button>';
}
matchMedia('(orientation:portrait)').addEventListener('change',()=>go(page||'accueil'));

// ---- Plein écran : sans barre du navigateur ----
const iOS=/iphone|ipad/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const installee=navigator.standalone||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
document.addEventListener('click',()=>{const e=document.documentElement;
  if(!installee&&!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen({navigationUI:'hide'}).catch(()=>{});},{once:true});
function astuce(){if(window.astuceVue||installee)return;window.astuceVue=1;
  setTimeout(()=>toast(iOS?"Astuce : Partager → Sur l'écran d'accueil, puis ouvre l'appli depuis son icône : plus de barre du navigateur":"Astuce : menu ⋮ du navigateur → Installer l'application, puis ouvre-la depuis son icône : plus de barre du navigateur"),1800);}

// ---- Démarrage ----
sb.auth.getSession().then(async({data})=>{if(data.session){const ok=await entrer();if(!ok)go('accueil');}else go('accueil');});
</script>
