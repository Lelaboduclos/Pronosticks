// ---- Étincelles qui scintillent sur toute l'illustration ----
const ec=$('etincelles'),c2=ec.getContext('2d');let E=[];
function tailleEc(){ec.width=innerWidth;ec.height=innerHeight;
  E=Array.from({length:Math.round(innerWidth*innerHeight/16000)},()=>({x:Math.random()*ec.width,y:Math.random()*ec.height,r:Math.random()*4+2,p:Math.random()*6.28,v:Math.random()*0.03+0.01,c:['255,255,255','255,211,77','41,216,255','255,61,242'][Math.floor(Math.random()*4)]}));}
tailleEc();addEventListener('resize',tailleEc);
function scintille(){requestAnimationFrame(scintille);c2.clearRect(0,0,ec.width,ec.height);
  E.forEach(s=>{s.p+=s.v;const a=Math.max(0,Math.sin(s.p));if(a<0.02)return;
    c2.globalAlpha=a;c2.fillStyle='rgb('+s.c+')';const r=s.r*a,x=s.x,y=s.y;
    c2.beginPath();c2.moveTo(x,y-r*2);c2.lineTo(x+r*.4,y-r*.4);c2.lineTo(x+r*2,y);c2.lineTo(x+r*.4,y+r*.4);c2.lineTo(x,y+r*2);c2.lineTo(x-r*.4,y+r*.4);c2.lineTo(x-r*2,y);c2.lineTo(x-r*.4,y-r*.4);c2.closePath();c2.fill();});}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)scintille();

async function mMatchsM(c){
  const {data:ms,error}=await sb.from('matchs_membres').select('*').order('date_match',{ascending:true}).limit(60);
  if(page!=='communaute')return;
  if(error)return comShell(c,'<small>Erreur : '+esc(error.message)+'</small>');
  const ids=(ms||[]).map(x=>String(x.match_id));
  let PP=[];
  if(ids.length){const {data:pp}=await sb.from('pronostics_publics').select('match_id,pseudo,avatar,choix,score_prevu,created_at').in('match_id',ids);PP=pp||[];}
  if(page!=='communaute')return;
  const stt=x=>x.termine?'termine':(new Date(x.date_match)<=Date.now()?'commence':'avenir');
  const L=(ms||[]).filter(x=>(CF==='Tous'||x.sport===CF)&&(CM==='tous'||stt(x)===CM));
  comShell(c,
   '<div class="chips">'+['Tous'].concat(SPORTS).map(k=>'<button class="'+(CF===k?'on':'')+'" onclick="CF=\''+k+'\';go(\'communaute\')">'+(k==='Tous'?'Tous':(IC[k]||''))+'</button>').join('')+'</div>'+
   (L.map(x=>{
     const ps=PP.filter(p=>String(p.match_id)===String(x.match_id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
     const st={termine:'Terminé',commence:'En cours',avenir:'À venir'}[stt(x)],nom={'1':x.equipe1,'N':'Match nul','2':x.equipe2};
     return '<div class="cd"><b>'+esc(x.equipe1)+' – '+esc(x.equipe2)+'</b><br><small>'+(IC[x.sport]||IC.Autre)+' '+esc(x.sport||'')+(x.ligue?' · '+esc(x.ligue):'')+' · '+dh(x.date_match)+' · '+st+(x.termine&&x.score_dom!=null?' · '+x.score_dom+'-'+x.score_ext:'')+'<br>Ajouté par '+esc(x.cree_par_pseudo||'un membre')+'</small><br><b>'+ps.length+' membre'+(ps.length>1?'s ont':' a')+' pronostiqué</b>'+
      ps.map(p=>'<div class="lg" style="justify-content:flex-start;gap:8px">'+av(p.avatar,24)+'<b>'+esc(p.pseudo||'?')+'</b> '+esc(nom[p.choix]||'—')+(p.score_prevu?' ('+esc(p.score_prevu)+')':'')+' <small style="margin-left:auto">'+dh(p.created_at)+'</small></div>').join('')+'</div>';
   }).join('')||'<div class="cd"><small>Aucun match ajouté par un membre pour le moment. Seuls les matchs ajoutés après la mise à jour apparaissent ici.</small></div>'));
}
